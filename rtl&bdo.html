<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bdo and rtl</title>
    <link rel="stylesheet" href="basci_html_reference.css">
</head>

<body>

    <!-- The HTML <bdo> element defines bi-directional override. -->
    <bdo class="ab">This text will be written from right to left</bdo>
    <!-- Set the text direction to "right-to-left": -->
    <p class="ac">This text goes from right to left</p>
    
</body>

</html>
