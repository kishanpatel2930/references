<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image as link</title>
    <link rel="stylesheet" href="basci_html_reference.css">
</head>

<body>

    <!-- simplest link format -->
    <a href="https://google.com">click here to go to google.com</a>
    <br>

    <!-- local file link -->
    <a href="basci_html_reference.js">basci_html_reference</a>
    <br>

    <!-- _blank - Opens the linked document in a new window or new tab -->
    <a class="af" href="https://www.w3schools.com/" target="_blank">Visit W3Schools!
    </a>
    <br>

    <!-- If your webpage is locked in a frame, you can use target="_top" to break out //of the frame: -->
    <a href="https://www.w3schools.com/html/" target="_top">HTML tutorial!</a><br>

    <!-- BUTTON as a link -->
    <button class="ad" onclick="window.location.href= 'https://facebook.com';">lets go to fb
    </button>
    <br>

    <!-- link as a button -->
    <a class="ag" href="https://google.com">google</a>
    <br>

    <!-- IMAGE link -->
    <p>
        <a href="/1.git files/cat.jpg" target="_blank">
            <img src="C:\Users\MY PC\Desktop\online class\1.git files\cat.jpg" alt="Error" style="width:300px;height:200px;border:0;">
            <br>
            click on image or here for original image!!!
        </a>
    </p>

</body>

</html>
