<!DOCTYPE html>

<!--The HTML lang attribute can be used to declare the language of a    Web page or a portion of a Web page.-->
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- The viewport is the user's visible area of a web page. It varies with the device - it will be smaller on a mobile phone than on a computer screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>basci_html_reference</title>

    <link rel="stylesheet" href="basci_html_reference.css">

    <script src="basci_html_reference.js"></script>

    <style>
        .para{
            background-color: aqua;
            height: 85px;
            width: 500px;
            border: 4px solid gold;
            border-radius: 11px;
            text-align:center;
            padding-top: 15px;
        }
    </style>

</head>

<body>

    <!-- we can change the format of heading as well as text -->
    <h1 title="this is for hint!!">H  &nbsp;eading 1</h1>

    <!-- Browsers display <strong> as <b>, and <em> as <i>. However, there is a difference in the meaning of these tags: <b> and <i> defines bold and italic text, but <strong> and <em> means that the text is "important".
        <b> - Bold text
        <strong> - Important text
        <i> - Italic text
        <em> - Emphasized text
        <mark> - Marked text
        <small> - Small text
        <del> - Deleted text
        <ins> - Inserted text
        <sub> - Subscript text
        <sup> - Superscript text -->

    <p class="aa">trying to change text format</p>

    <p class="para">this is my second paragraph</p>

</body>

</html>
